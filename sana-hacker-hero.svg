<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09070F"/>
      <stop offset="100%" stop-color="#150B26"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4FD8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4FD8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#8B5CF6" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="url(#bgGrad)"/>
  <rect width="900" height="220" fill="url(#grid)"/>

  <rect x="0" y="0" width="900" height="220" fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="2"/>

  <circle cx="28" cy="26" r="6" fill="#FF4FD8" opacity="0.85"/>
  <circle cx="48" cy="26" r="6" fill="#8B5CF6" opacity="0.85"/>
  <circle cx="68" cy="26" r="6" fill="#FFFFFF" opacity="0.4"/>
  <text x="90" y="31" font-family="Courier New, monospace" font-size="13" fill="#8B5CF6" opacity="0.8">sana@github: ~</text>

  <text x="40" y="95" font-family="Courier New, monospace" font-size="15" fill="#8B5CF6" opacity="0.85">$ whoami</text>

  <text x="40" y="135" font-family="Consolas, Courier New, monospace" font-size="42" font-weight="bold" fill="url(#textGrad)" filter="url(#glow)">Sana Tariq</text>

  <text x="40" y="165" font-family="Courier New, monospace" font-size="16" fill="#FFFFFF" opacity="0.85">Full-Stack Developer • Laravel • Node.js • React • Next.js</text>

  <rect x="40" y="182" width="380" height="6" rx="3" fill="url(#barGrad)" opacity="0.9"/>

  <text x="820" y="200" font-family="Courier New, monospace" font-size="12" fill="#8B5CF6" text-anchor="end" opacity="0.6">STATUS: ONLINE ✓</text>
</svg>
